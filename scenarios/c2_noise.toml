# C2: ruído e falsos alarmes (análise §8.2).
# Falsos positivos dos sensores x5, alguns sensores em deriva, cidadãos que leem mal a cena, observação menos fiável.
# Perguntas: a corroboração e a reputação mantêm a precisão com pouco atraso extra? AlertFirst ou ConfirmFirst?
# O portador nunca responde a metade dos falsos positivos dos dispositivos em deriva (dispositivo deixado numa mesa),
# por isso estes passam a regra OS4 de fontes independentes e chegam ao despacho; é com as fontes que reincidem que a
# reputação aprende. A AlertFirst e a ConfirmFirst esperam ambas pelo portador antes de o hub poder declarar (OS4),
# por isso diferem na latência (M1) e nas mensagens (M8).
# Variantes: --set sensors.policy=alert_first | confirm_first; --set policy.reputation=false; --set policy.allocation=naive

[run]
name = "c2_noise"

[sensors]
fp_per_device_hour = 0.1          # x5 a taxa de base
drifting_devices = 4              # modo de falha F3: sensores em deriva
drift_fp_per_hour = 3.0           # um sensor avariado dispara a cada ~20 min, por isso o mesmo dispositivo repete-se num run
drift_p_no_response = 0.5         # o portador nunca responde a metade dos falsos positivos de um dispositivo em deriva

[witness]
false_report_per_hour = 0.1       # modo de falha F4: por testemunha, ~1,5 cenas mal lidas por hora na cidade
observation_error = 0.2
