# C2 — Noise and false alarms (analysis §8.2).
# Sensor false positives x5, some drifting sensors, citizens who misread scenes, less reliable observation.
# Questions: do corroboration and reputation keep precision with little extra delay? AlertFirst or ConfirmFirst?
# Half of the drifting devices' false positives are never answered by the wearer (device left on a table), so they
# pass OS4 and reach dispatch; repeated offenders are what reputation can learn from. AlertFirst and ConfirmFirst
# both wait for the wearer before the hub can declare (OS4), so they differ in latency (M1) and messages (M8).
# Variants: --set sensors.policy=alert_first | confirm_first; --set policy.reputation=false; --set policy.allocation=naive

[run]
name = "c2_noise"

[sensors]
fp_per_device_hour = 0.1          # x5 the base rate
drifting_devices = 4              # F3
drift_fp_per_hour = 3.0           # a faulty sensor misfires every ~20 min, so the same device repeats within a run
drift_p_no_response = 0.5         # the wearer never answers half of a drifting device's false positives

[witness]
false_report_per_hour = 0.1       # F4: per bystander, ~1.5 misread scenes per hour in the city
observation_error = 0.2
