# Parâmetros por omissão, comuns a todos os cenários. Um ficheiro de cenário sobrepõe-se a qualquer chave que repita.
# Unidades: segundos simulados, metros, metros por segundo.
# Fontes: análise Gaia §8.3 (valores iniciais) e docs/02-architectural-design.md (decisões D1–D8).

[run]
name = "defaults"
duration_s = 3600
clock_factor = 10                 # spikes/README.md: os atrasos reais distorcem o tempo simulado em <= ~0,3 s
seed = 1
start_batch = 10                  # agentes arrancados em simultâneo (o pyjabber perde rajadas de logins)
start_retries = 4
max_suspend_s = 2.0               # validade: a máquina não pode ficar suspensa mais tempo do que isto
max_stall_sim_s = 2.0             # validade: maior bloqueio do event loop, em segundos simulados

[city]                            # pressuposto A1: cidade em grelha, deslocações de Manhattan
size_m = 3000
grid_spacing_m = 100
scene_radius_m = 30               # quem está a esta distância de um doente está "no local" (a testemunha fica a 5-15 m)

[population]                      # análise §8.3 "Dimensão"
devices = 40                      # dispositivos de sensor dos cidadãos (SensorMonitor)
bystanders = 15                   # potenciais testemunhas (WitnessReporter / OnSceneHelper)
volunteers = 30                   # VolunteerResponder / AEDRunner
aeds = 10                         # armários de DAE = hubs das células (decisão D1, topologia por célula)
aed_min_distance_m = 600
ems_bases = [[600, 600], [2400, 600], [600, 2400], [2400, 2400]]

[incidents]                       # análise §4.3: chegadas de Poisson, mistura de P1/P2/P3
rate_per_hour = 3.0
priority_mix = { P1 = 0.5, P2 = 0.3, P3 = 0.2 }
p1_shockable = 0.4                # fração dos P1 com ritmo desfibrilhável
p_wearer = 0.5                    # o doente usa um dos dispositivos dos cidadãos
p_witness = 0.6                   # uma testemunha vê o colapso (pressuposto A5)
witness_busy_s = 1800             # uma testemunha assiste no máximo a um incidente a cada 30 min
witness_distance_m = [5, 15]      # distância da testemunha ao doente
surge = {}                        # C3: { t_s, duration_s, count, centre = [x, y], radius_m, p_witness }

[sensors]                         # pressuposto A2: sensores dos cidadãos
tpr = 0.9                         # probabilidade de o colapso real de um portador ser detetado
fp_per_device_hour = 0.02         # falsos positivos por dispositivo e por hora
detection_delay_s = [10, 20]      # reconhecer a queda e a imobilidade leva tempo
p_cardiac_flag_on_fp = 0.3        # falsos positivos que também mostram um sinal cardíaco anómalo
policy = "adaptive"               # adaptive (AlertFirst só para sinais de tipo P1) | alert_first | confirm_first
drifting_devices = 0              # modo de falha F3: dispositivos com sensores em deriva (C2)
drift_fp_per_hour = 1.0
drift_p_cardiac_flag = 0.6
quality_true = [0.7, 1.0]         # qualidade do sinal de um colapso real; escala a confiança do dispositivo
quality_false = [0.5, 1.0]        # qualidade do sinal de um falso positivo
p_immobile_on_fp = 0.5            # falsos positivos que também mostram imobilidade
drift_p_immobile = 0.8
drift_p_no_response = 0.0         # F3: falsos positivos de um dispositivo em deriva a que o portador nunca responde (dispositivo deixado numa mesa, portador a dormir)
event_confidence = { collapse_cardiac = 0.95, fall_immobile = 0.8, fall = 0.5 }   # x qualidade do sinal

[wearer]
prompt_countdown_s = 30           # contagem decrescente do "Está bem?" (análise §8.3: 30–60 s)
p_respond_if_able = 0.9           # um portador consciente responde à pergunta
response_delay_s = [3, 25]

[witness]                         # pressuposto A5: comportamento das testemunhas
p_report = 0.8
report_confidence = 0.8           # confiança que a testemunha põe no seu relato (P01) e na confirmação (P03)
scene_memory_s = 900              # durante quanto tempo depois de ver a cena a testemunha ainda responde sobre ela
report_delay_s = [20, 60]
p_answer = 0.95                   # responde a cada pergunta da triagem
answer_delay_s = [3, 10]
observation_error = 0.1           # probabilidade de ler mal "responde" / "respira normalmente"
p_called_112 = 0.5
react_delay_s = [3, 8]            # OnSceneHelper: tempo até começar cada instrução
p_give_up = 0.03                  # por instrução
p_give_up_per_cycle = 0.03        # acréscimo por ciclo de compressões depois do segundo (cansaço)
tired_after_cycles = 3            # reporta TIRED a partir do terceiro ciclo de dois minutos
t_silence_s = 20                  # T_silence: a guia repete a instrução e depois reporta WITNESS_SILENT
false_report_per_hour = 0.0       # modo de falha F4: um cidadão lê mal uma cena (alguém a dormir parece inconsciente) (C2)
false_report_radius_m = 200       # a cena mal lida fica, no máximo, a esta distância da casa do cidadão
pranksters = 0                    # C5: cidadãos que relatam repetidamente colapsos que não aconteceram
prankster_rate_per_hour = 4.0     # relatos falsos por hora de cada um deles

[volunteers]                      # pressuposto A6: comportamento dos voluntários
p_accept = 0.7
eval_delay_s = [3, 8]             # ler o alerta e decidir
modes = { foot = 0.6, bike = 0.2, car = 0.2 }
qualification_mix = { BLS = 0.3, BLS_AED = 0.6, HEALTH_PRO = 0.1 }
max_alerts_per_hour = 6           # OS8, fadiga dos voluntários: limite de alertas por hora (A_max)
max_consecutive_awards = 3        # OS8: limite de adjudicações seguidas (K_max)
award_window_s = 7200             # OS8: adjudicações mais antigas do que isto deixam de contar para K_max
aed_retrieval_s = 30              # destrancar o armário e tirar o DAE
aed_answer_timeout_s = 20         # sem resposta do hub do armário, o voluntário segue sem o DAE
p_no_show = 0.05                  # adjudicado, mas nunca chega
p_withdraw_if_no_show = 0.5       # destes, a parte que desiste a caminho (os outros deixam de responder)
withdraw_after_s = [30, 120]      # quando desiste um voluntário que vai desistir
speed_variability = [1.0, 1.3]    # tempo real de deslocação / tempo estimado
max_on_scene_s = 1800             # abandona uma missão cuja libertação se perdeu (modo de falha F5, mensagem perdida)

[travel]
foot = { speed = 2.0, overhead_s = 0 }
bike = { speed = 4.5, overhead_s = 20 }
car = { speed = 8.0, overhead_s = 60 }
ambulance = { speed = 8.3, overhead_s = 0 }   # ~30 km/h de média em tráfego urbano

[ems]
# Atendimento da chamada e ativação da equipa antes de a unidade sair. Com 30 km/h, dá uma resposta mediana
# de cerca de 7 min em C1. É um valor assumido: não encontrámos uma fonte para os tempos de resposta urbanos
# em Portugal, e o relatório trata-o como limitação (secção 7).
dispatch_delay_s = 240
care_on_scene_s = 180
roster_wait_s = 10                # espera pela lista do coordenador com quem está no local (P13)
handover_wait_s = 20              # espera pelo resumo da passagem do caso (P19)
transport_s = 600                 # até a unidade voltar a estar disponível
first_shock_delay_s = 60          # M6, proxy de sobrevivência: sem um DAE já colocado, a equipa dá o primeiro choque este tempo depois de chegar

[aed]
restock_s = 1800                  # um DAE usado fica fora de serviço até ser verificado e reposto
reservation_valid_s = 900         # T_code: validade de uma reserva de DAE
p_faulty = 0.0                    # probabilidade de o DAE de um armário faltar ou estar avariado
p_closed = 0.0                    # probabilidade de um armário estar trancado (fora do horário, C4)

[network]                         # pressuposto A3: latência, perdas e zonas sem rede, injetadas pelo NetworkModel (dentro do processo o SPADE não usa XMPP)
latency_median_s = 0.3
latency_sigma = 0.5               # dispersão da log-normal
latency_max_s = 5.0
loss = 0.0
outages = []                      # [[network.outages]] cell = 3, from_s = 600, to_s = 1200

[verification]                    # decisão D5: fusão de evidência e limiares de declaração
# Calibração (log-odds, fontes com a confiança inicial; confiança do dispositivo = qualidade x 0,95 / 0,8 / 0,5):
#   alerta de dispositivo P1 (conf. ~0,8) + portador sem resposta:  logit(.15) + .8 ln3 + ln10 = 1.45 -> p = .81 >= .60
#   alerta de dispositivo P2 (conf. ~0,68) + portador sem resposta:                             1.32 -> p = .79 >= .75
#   qualquer alerta de dispositivo + portador responde "estou bem":                            -3.8  -> p = .02  (descarta)
#   relato de testemunha (conf. .8) + triagem "não responde, não respira":                      2.0  -> p = .88 >= .60
prior = 0.15                      # P(incidente real | foi aberto um candidato)
tau_declare = { P1 = 0.6, P2 = 0.75, P3 = 0.85 }
# A análise propunha W_max = 30/60/120 s. Os de P1 e P2 sobem acima da contagem decrescente do portador; de outro
# modo, o terceiro ramo da regra OS4 de fontes independentes (alerta automático + portador sem resposta) nunca se completaria.
w_max_s = { P1 = 45, P2 = 75, P3 = 120 }
discard_below = 0.03              # descarta logo que a crença desce abaixo disto
retract_below = 0.3               # P07: um caso declarado cuja crença desce abaixo disto é retirado
corroboration_deadline_s = 10
alert_ack_timeout_s = 10          # sem AlertAck, a fonte tenta o sucessor do hub (modo de falha F6, hub em baixo)
alert_hubs_tried = 3              # o hub da célula e depois até dois sucessores
retry_after_s = 20                # modo de falha F5: reenvia um pedido sem resposta ao fim deste tempo
max_retries = 2
triage_deadline_s = 12            # as testemunhas respondem em 3-10 s; deixa margem para uma repetição dentro de W_max
merge_window_s = 90
merge_radius_m = 100              # os alertas fundem-se se as suas áreas (grelha de 100 m) estiverem a esta distância (Manhattan)
trust_prior = 0.5
human_reliable_min_trust = 0.4    # uma testemunha com pelo menos esta confiança conta como "humano fiável" (OS4)

[verification.likelihood_ratio]   # LR de cada tipo de evidência; escalada pela confiança da fonte
sensor_alert = 3.0
wearer_no_response = 10.0
wearer_ok = 0.05
witness_report = 6.0
witness_retracts = 0.2
corroboration_confirm = 5.0
corroboration_deny = 0.3
triage_p1 = 10.0                  # "não responde e não respira normalmente"
triage_p2 = 6.0                   # "não responde, mas respira"

[dispatch]                        # decisão D4: alocação por Contract Net
proposal_deadline_s = 12          # prazo das propostas dos voluntários em P08 (análise §8.3: 10–15 s)
ambulance_deadline_s = 8          # prazo das propostas das ambulâncias em P10
location_wait_s = 10              # espera extra pela divulgação da localização (P24) antes de adjudicar
reservation_timeout_s = 5
n_max = 4                         # N_max: socorristas adjudicados por caso
n_need = { P1 = 2, P2 = 1 }       # N_need(p): socorristas no local a partir dos quais os que ainda vão a caminho são libertados (OL8)
eta_slack_s = 120                 # δ em "ETA + δ"
quality_penalty = 0.5             # multiplicador do ETA para propostas abaixo da qualificação pedida
trust_exponent = 1.0
ambulance_retry_s = 30
case_timeout_s = 3600
candidate_aeds = 3                # DAE oferecidos numa chamada FETCH_AED

[dispatch.redundancy]             # tarefas por prioridade (análise §8.3: P1 = 2 RCP + 1 DAE)
P1 = { GO_TO_PATIENT = 2, FETCH_AED = 1 }
P2 = { GO_TO_PATIENT = 1 }
P3 = {}

[reputation]                      # decisão D6: modelo de reputação Beta
peer_discount = 0.5               # d: peso das contagens de um hub vizinho (os hubs confiam uns nos outros ao nível do prior)
gossip_period_s = 600             # P23: partilha de reputação entre hubs vizinhos
decay_period_s = 600              # decaimento das contagens para o prior (_DecayTrust)
decay_factor = 0.98               # parte das contagens mantida em cada período (perde-se ~11 % por hora)

[failover]                        # decisão D8: recuperação de um hub que falha
heartbeat_s = 5                   # período do heartbeat do hub para o sucessor (P27)
lease_heartbeats = 3              # lease L = 3 heartbeats
takeover_margin_heartbeats = 1    # o sucessor espera L + 1 heartbeat antes de assumir

[faults]                          # injeção de falhas (cenário C4, robustez M12)
hub_crashes = []                  # [[faults.hub_crashes]] hub = 3, at_s = 900

[privacy]                         # decisão D7 e regra OS11: privacidade e retenção de dados
retention_s = 600                 # T_ret: os dados pessoais são purgados, no máximo, este tempo depois do CloseCase
max_retention_s = 7200            # purga de recurso se o fecho nunca chegar ao guardião

[metrics]                         # só usados para calcular as métricas, nunca pelos agentes
match_radius_m = 50               # uma localização divulgada a esta distância de um doente é associada a esse incidente
central_radius_m = 1000           # M13, equidade: incidentes a esta distância do centro da cidade são "centrais"
report_window_s = 120             # M2: um alerta do dispositivo do doente ou de uma testemunha até este tempo depois do colapso conta como reportado

[registration]                    # decisão D3, descoberta: registo nos hubs até esta distância em anéis
ring = { volunteer = 2, witness = 1, sensor = 1 }

[policy]                          # pontos de variação (docs/02 §9)
allocation = "contract_net"       # contract_net | naive (baseline B1)
reputation = true
guidance = true                   # false: sem guia da testemunha (P05), para separar o seu efeito do da alocação

[scripted]                        # incidentes injetados a horas fixas, por cima do processo de Poisson
incidents = []                    # [[scripted.incidents]] t_s, priority, shockable, wearer, witness
