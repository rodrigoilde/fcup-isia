# C4: periferia degradada (análise §8.2).
# Metade dos voluntários, metade dos armários de DAE trancados à noite, rede intermitente, ambulâncias longe e um
# hub que falha enquanto coordena um caso.
# Perguntas: a guia sem rede e a realocação aguentam os tempos? Quanto custa recuperar um coordenador (M12)?

[run]
name = "c4_periphery"

[population]
volunteers = 15
ems_bases = [[-1500, 1500], [4500, 1500]]   # bases fora da área

[ems]
dispatch_delay_s = 300

[aed]
p_closed = 0.5

[network]
loss = 0.05
outages = [{ cell = 5, from_s = 600, to_s = 1500 }, { cell = 7, from_s = 1800, to_s = 2700 }]

[faults]
hub_crashes = [{ hub = 2, at_s = 1200 }]

# Um P1 na célula do hub 2 pouco antes de este falhar, para haver um caso em curso no momento da falha.
# Tem um dispositivo e uma testemunha que reporta, para a deteção não depender de um único sorteio.
[[scripted.incidents]]
id = "F1"
t_s = 900
priority = "P1"
shockable = true
wearer = true
witness = true
witness_reports = true
cell = 2
