# C3: pico com contenção (análise §8.2).
# Fim de um concerto: oito incidentes em dez minutos num raio de 400 m, a disputar voluntários, DAE e ambulâncias.
# Perguntas: a exclusividade (OS2, um compromisso por voluntário; OS3, uma reserva por DAE) e as regras de prioridade
# evitam conflitos? Quanta redundância compensa?
# Variantes: --set dispatch.redundancy.P1.GO_TO_PATIENT=1 | 2 | 3

[run]
name = "c3_surge"

[incidents]
rate_per_hour = 2.0
surge = { t_s = 900, duration_s = 600, count = 8, centre = [1500, 1500], radius_m = 400, p_witness = 0.9, priority_mix = { P1 = 0.6, P2 = 0.4 } }
